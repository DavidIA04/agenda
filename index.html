<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>
<meta name="description" content="Agenda, entreno, comidas y progreso. Funciona sin conexión.">
<meta name="theme-color" content="#171C26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<script>
(function(){ var m = 'auto'; try { m = localStorage.getItem('agenda.mode') || 'auto'; } catch(e){} document.documentElement.setAttribute('data-mode', m); })();
</script>
<style>
/* Layout: app móvil de una columna (máx. 480px; en ordenador se abre a 1100px con Hoy en dos columnas y el tablero en cuatro). Barra de pestañas abajo, hojas que suben, pantallas completas para Pomodoro, revisión y búsqueda. Modo oscuro (por defecto), claro o automático. */
:root{
  --bg:#171C26; --surface:#212836; --surface2:#2A3342; --line:#384356; --fg:#F2F5FA; --muted:#A1AABB; --faint:#717C90;
  --accent:#5B93FF; --work:#FF7A3D; --rest:#2BD4A4;
  --hi:#FF5A68; --mid:#FFB23F; --lo:#3DDC84;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  --f-display:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body:"Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#EDF0F5; --line:#D9DEE7; --fg:#141A24; --muted:#5B6577; --faint:#8C95A5;
  --accent:#2F6FEB; --work:#F0622A; --rest:#12A97F; --hi:#E23B4C; --mid:#D98B07; --lo:#1E9E57;
  --shadow:0 10px 26px -16px rgba(20,26,36,.35); color-scheme:light;
}
@media (prefers-color-scheme: light){ :root[data-mode="auto"]{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#EDF0F5; --line:#D9DEE7; --fg:#141A24; --muted:#5B6577; --faint:#8C95A5;
  --accent:#2F6FEB; --work:#F0622A; --rest:#12A97F; --hi:#E23B4C; --mid:#D98B07; --lo:#1E9E57;
  --shadow:0 10px 26px -16px rgba(20,26,36,.35); color-scheme:light; } }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4; margin:0; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
.app{max-width:1200px; margin:0 auto; min-height:100%; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:12px calc(116px + env(safe-area-inset-bottom,0px))}
.demo{font-size:.72rem; color:var(--muted); text-align:center; padding:6px 10px; border:1px dashed var(--line); border-radius:999px; margin:0 auto 10px; width:fit-content}
.demo b{color:var(--fg)}

.hdr{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:14px}
.hdr h1{font-family:var(--f-display); font-weight:800; font-size:2.3rem; line-height:.95; margin:0; letter-spacing:.01em; text-transform:uppercase}
.hdr .sub{color:var(--muted); font-size:.88rem; margin-top:4px}
.hdr .sub b{color:var(--fg)}
.icon-btn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; flex:none}
.icon-btn svg{width:18px; height:18px; stroke:var(--fg); fill:none; stroke-width:2}
.pill-btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; font-weight:600; font-size:.84rem}
.pill-btn.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.mini{border:1px solid var(--line); background:var(--surface2); border-radius:8px; padding:3px 9px; font-size:.72rem; font-weight:700; letter-spacing:.02em; text-transform:none; color:var(--fg)}

.stack{display:flex; flex-direction:column; gap:10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px; position:relative; box-shadow:var(--shadow)}
.card .eyebrow{font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; gap:8px; align-items:center}
.card h3{font-family:var(--f-display); font-weight:700; font-size:1.55rem; margin:4px 0 2px; letter-spacing:.01em; line-height:1.05}
.meta{color:var(--muted); font-size:.84rem}
.card.tap{cursor:pointer}
.play{width:52px; height:52px; border-radius:50%; border:none; background:var(--work); display:grid; place-items:center; flex:none}
.play svg{width:20px; height:20px; fill:#fff; margin-left:3px}
.row{display:flex; align-items:center; gap:12px}
.grow{flex:1; min-width:0}
.edit-ctl{display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line)}
.edit-ctl button{border:1px solid var(--line); background:var(--surface2); border-radius:10px; padding:6px 10px; font-size:.8rem; font-weight:600}
.hidden-list{display:flex; flex-wrap:wrap; gap:6px; align-items:center; color:var(--muted); font-size:.82rem}

.rings{display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px; margin-top:10px}
.ring{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; border:none; background:none; padding:0}
.ring .r{width:54px; height:54px; border-radius:50%; background:conic-gradient(var(--rc) calc(var(--p)*1turn), color-mix(in srgb,var(--rc) 20%, var(--surface)) 0); -webkit-mask:radial-gradient(circle, transparent 56%, #000 57%); mask:radial-gradient(circle, transparent 56%, #000 57%)}
.ring .rw{position:relative; width:54px; height:54px}
.ring .rw span{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:1rem}
.ring small{font-size:.72rem; color:var(--muted); line-height:1.2}

.strip{position:relative; height:46px; margin-top:12px; border-radius:10px; background:var(--surface2); overflow:hidden}
.strip .blk{position:absolute; top:6px; bottom:6px; border-radius:7px; background:color-mix(in srgb, var(--bc) 32%, var(--surface2)); border-left:3px solid var(--bc); font-size:.68rem; font-weight:600; padding:3px 5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.strip .now{position:absolute; top:0; bottom:0; width:2px; background:var(--work)}
.hours{display:flex; justify-content:space-between; font-size:.64rem; color:var(--faint); margin-top:4px}

/* tareas: la franja lleva el color del proyecto o tipo; la prioridad va en su etiqueta */
.task{display:flex; align-items:center; gap:10px; padding:10px 12px 10px 14px; background:var(--surface2); border-radius:12px; position:relative; overflow:hidden; cursor:pointer}
.task::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--tc)}
.chk{width:24px; height:24px; border-radius:50%; border:2px solid var(--tc); background:transparent; flex:none; display:grid; place-items:center; padding:0}
.chk svg{width:13px; height:13px; stroke:#fff; stroke-width:3; fill:none; opacity:0}
.task.done .chk, .kcard.done .chk{background:var(--tc)} .task.done .chk svg{opacity:1}
.task.done .tt{text-decoration:line-through; color:var(--muted)}
.tt{font-weight:600; font-size:.94rem; overflow-wrap:anywhere}
.tm{display:flex; flex-wrap:wrap; gap:4px 8px; font-size:.75rem; color:var(--muted); margin-top:3px; align-items:center}
.badge{font-size:.68rem; font-weight:700; border-radius:6px; padding:1px 6px; letter-spacing:.02em}
.badge.warn{background:color-mix(in srgb, var(--mid) 22%, transparent); color:var(--mid)}
.badge.due{background:color-mix(in srgb, var(--hi) 18%, transparent); color:var(--hi)}
.badge.pj{background:color-mix(in srgb, var(--tc) 20%, transparent); color:var(--fg)}
.prio{font-size:.66rem; font-weight:800; border-radius:6px; padding:1px 6px; text-transform:uppercase; letter-spacing:.06em; color:#fff}
.prio.alta{background:var(--hi)} .prio.media{background:var(--mid)} .prio.baja{background:var(--lo)}
.dur{font-family:var(--f-display); font-weight:600; font-size:1.05rem; color:var(--muted); flex:none}
.list{display:flex; flex-direction:column; gap:6px}

.seg{display:flex; overflow-x:auto; scrollbar-width:none; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px; gap:4px; margin-bottom:14px}
.seg button{flex:1 0 auto; border:none; background:transparent; border-radius:10px; padding:9px 6px; font-weight:600; color:var(--muted); font-size:.9rem}
.seg button.on{background:var(--accent); color:#fff}

.day{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px}
.day.today{border-color:var(--accent); border-width:2px}
.drop{outline:2px dashed var(--accent)}
.dayh{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px}
.dayh .dn{font-family:var(--f-display); font-weight:700; font-size:1.35rem; text-transform:uppercase; letter-spacing:.02em}
.dayh .dn span{color:var(--muted); font-weight:600}
.load{font-size:.74rem; color:var(--muted); text-align:right}
.load.over{color:var(--hi); font-weight:700}
.lbar{height:5px; border-radius:3px; background:var(--surface2); overflow:hidden; margin:2px 0 8px}
.lbar i{display:block; height:100%; background:var(--lo)}
.lbar.over i{background:var(--hi)} .lbar.mid i{background:var(--mid)}
.fixed{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px}
.fx{font-size:.72rem; font-weight:600; border-radius:6px; padding:2px 7px; background:color-mix(in srgb, var(--bc) 24%, var(--surface)); border-left:3px solid var(--bc)}
.inbox{background:var(--surface); border:1.5px dashed var(--muted); border-radius:16px; padding:12px; margin-bottom:12px}
.inbox h4, .sect{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:700}
.empty{color:var(--faint); font-size:.84rem; padding:6px 2px}
.cta{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:13px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px}

/* tablero */
.filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none}
.fchip{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 13px; font-size:.82rem; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:6px}
.fchip i{width:9px; height:9px; border-radius:50%; background:var(--tc)}
.fchip.on{color:var(--bg); background:var(--fg); border-color:var(--fg)}
.colpick{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-bottom:10px}
.colpick button{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 4px; font-weight:700; font-size:.76rem; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px}
.colpick button b{font-family:var(--f-display); font-size:1.4rem; color:var(--fg); line-height:1}
.colpick button.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); color:var(--fg)}
.projbar{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--tc); border-radius:14px; padding:12px 14px; margin-bottom:10px}
.projbar .pbt{display:flex; justify-content:space-between; gap:8px; font-weight:700; font-size:1.05rem}
.prog{height:7px; border-radius:4px; background:var(--surface2); overflow:hidden; margin:8px 0 4px}
.prog i{display:block; height:100%; background:var(--tc, var(--accent))}
.board{display:block}
.col{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:12px; min-height:58vh; display:flex; flex-direction:column; gap:8px}
.col[data-hide="1"]{display:none}
.colh{display:flex; justify-content:space-between; font-family:var(--f-display); font-weight:700; font-size:1.25rem; text-transform:uppercase; letter-spacing:.03em; padding:2px 4px 4px}
.colh span:last-child{color:var(--muted)}
.kcard{background:var(--surface2); border-radius:14px; padding:14px 14px 14px 18px; position:relative; cursor:grab; display:flex; flex-direction:column; gap:6px}
.kcard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; border-radius:14px 0 0 14px; background:var(--tc)}
.kcard .tt{font-size:1.02rem}
.kcard.done .tt{text-decoration:line-through; color:var(--muted)}
.sub-prog{display:flex; gap:3px}
.sub-prog i{flex:1; height:4px; border-radius:2px; background:var(--line)}
.sub-prog i.d{background:var(--lo)}

.mgrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
.mgrid .wd{font-size:.66rem; color:var(--muted); text-align:center; letter-spacing:.1em; font-weight:700; padding-bottom:4px}
.mday{aspect-ratio:1 / 1.05; max-width:100%; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:6px; gap:4px; font-weight:600; font-size:.88rem}
.mday.out{opacity:.35}
.mday.sel{border-color:var(--accent); border-width:2px}
.mday.today .n{background:var(--fg); color:var(--bg); border-radius:999px; padding:0 6px}
.dots{display:flex; gap:3px; flex-wrap:wrap; justify-content:center; max-width:90%}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--dc)}
.dots i.ring{background:transparent; box-shadow:inset 0 0 0 1.5px var(--dc)}
.dots i.miss{background:var(--hi); border-radius:1px; transform:rotate(45deg); width:6px; height:6px}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:.75rem; color:var(--muted); margin:10px 0}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:8px; height:8px; border-radius:50%; background:var(--dc)}
.ev{display:flex; gap:10px; align-items:center; padding:10px 12px; background:var(--surface2); border-radius:12px; border-left:4px solid var(--dc)}
.ev .h{font-family:var(--f-display); font-weight:700; font-size:1.05rem; min-width:48px}

.stats3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:14px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px}
.stat b{display:block; font-family:var(--f-display); font-size:1.9rem; font-weight:700; line-height:1}
.stat small{color:var(--muted); font-size:.72rem}

/* comidas */
.people{display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none}
.kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px}
.kpi b{display:block; font-family:var(--f-display); font-weight:700; font-size:2rem; line-height:1}
.kpi small{color:var(--muted); font-size:.74rem}
.spark{width:100%; height:70px; display:block; margin-top:8px}
.meal{border-top:1px solid var(--line); padding-top:10px; margin-top:10px}
.meal:first-of-type{border-top:none; margin-top:4px; padding-top:0}
.mealh{display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:6px}
.food{display:flex; justify-content:space-between; gap:8px; font-size:.88rem; padding:5px 0}
.food span:last-child{color:var(--muted); white-space:nowrap}

/* ajustes en Más */
.setlist{background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow)}
.setrow{display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; border:none; border-bottom:1px solid var(--line); background:transparent; text-align:left}
.setrow:last-child{border-bottom:none}
.setrow .ic{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:color-mix(in srgb, var(--ic) 22%, var(--surface2)); flex:none}
.setrow .ic i{width:12px; height:12px; border-radius:4px; background:var(--ic)}
.setrow b{display:block; font-weight:600}
.setrow small{color:var(--muted); font-size:.78rem}
.setrow .chev{color:var(--faint); font-size:1.2rem}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:6px max(10px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px))}
.tabbar .in{max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
.tab{border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--faint); font-size:.7rem; font-weight:600}
.tab svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9}
.tab.on{color:var(--accent)}
.fab{position:fixed; z-index:21; right:max(16px, calc(50% - 600px + 16px)); bottom:calc(80px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:18px; border:none; background:var(--accent); color:#fff; font-size:1.9rem; line-height:1; display:grid; place-items:center; box-shadow:0 12px 28px -10px color-mix(in srgb, var(--accent) 70%, transparent)}

.scrim{position:fixed; inset:0; z-index:40; background:rgba(8,10,16,.55)}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:640px; margin:0 auto; background:var(--surface); border-radius:22px 22px 0 0; border:1px solid var(--line); border-bottom:none; max-height:90%; overflow-y:auto; padding:10px max(18px, env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-right,0px))}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px}
.sheet h2{font-family:var(--f-display); font-weight:700; font-size:1.6rem; margin:0 0 4px; text-transform:uppercase}
.sheet .lead{color:var(--muted); font-size:.86rem; margin:0 0 14px}
.fld{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.fld > label, .fld > .lab{font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.inp{border:1px solid var(--line); background:var(--surface2); border-radius:12px; padding:11px 12px; width:100%; min-width:0}
.title-inp{font-size:1.1rem; font-weight:600}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{border:1px solid var(--line); background:var(--surface2); border-radius:10px; padding:8px 12px; font-weight:600; font-size:.84rem; display:inline-flex; align-items:center; gap:6px}
.opt i{width:10px; height:10px; border-radius:50%; background:var(--tc)}
.opt.on{border-color:var(--fg); background:var(--fg); color:var(--bg)}
.opt.prio-alta.on{background:var(--hi); border-color:var(--hi); color:#fff} .opt.prio-media.on{background:var(--mid); border-color:var(--mid); color:#fff} .opt.prio-baja.on{background:var(--lo); border-color:var(--lo); color:#fff}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.durbox{display:flex; gap:8px; align-items:center}
.durbox .inp{width:72px; text-align:center; font-family:var(--f-display); font-size:1.3rem; font-weight:700; padding:6px}
.durbox span{color:var(--muted); font-weight:600}
.subrow{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line)}
.subrow .chk{--tc:var(--lo); width:22px; height:22px}
.subrow.done .chk{background:var(--lo)} .subrow.done .chk svg{opacity:1}
.subrow.done .st{text-decoration:line-through; color:var(--muted)}
.st{flex:1; min-width:0; font-size:.9rem}
.sdur{font-size:.8rem; color:var(--muted); font-weight:600}
.sheet-actions{display:flex; gap:8px; margin-top:6px}
.sheet-actions .btn{flex:1}
.btn{border:none; border-radius:14px; padding:13px; font-weight:700}
.btn.primary{background:var(--accent); color:#fff}
.btn.ghost{background:var(--surface2); border:1px solid var(--line)}
.btn.danger{background:transparent; color:var(--hi); border:1px solid color-mix(in srgb, var(--hi) 45%, transparent)}
.cal-btn{display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--line); background:var(--surface2); border-radius:12px; padding:11px 12px; font-weight:600; margin-bottom:14px; text-align:left}
.cal-btn svg{width:20px; height:20px; stroke:var(--fg); fill:none; stroke-width:1.8; flex:none}
.cal-btn small{display:block; color:var(--muted); font-weight:500; font-size:.76rem}
.sw{display:flex; flex-wrap:wrap; gap:7px}
.sw button{width:28px; height:28px; border-radius:50%; border:3px solid var(--surface); background:var(--c); box-shadow:0 0 0 1.5px var(--line); padding:0}

.colorrow{padding:10px 0; border-bottom:1px solid var(--line)}
.colorrow .nm{display:flex; align-items:center; gap:8px; font-weight:600; margin-bottom:8px}
.colorrow .nm i{width:12px; height:12px; border-radius:4px; background:var(--c)}
.goalrow{display:grid; grid-template-columns:minmax(0,1fr) 70px 64px 30px; gap:6px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}

.goalrow .sw{grid-column:1 / -1}
.modes{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.modes button{border:1px solid var(--line); border-radius:14px; padding:12px 8px; background:var(--surface2); font-weight:700; display:flex; flex-direction:column; align-items:center; gap:8px}
.modes button.on{border-color:var(--accent); border-width:2px}
.modes .pv{width:56px; height:36px; border-radius:8px; border:1px solid var(--line)}

.full{position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; padding:calc(16px + env(safe-area-inset-top,0px)) max(18px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px))}
.full .in{max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column}
.pomo{--pc:var(--work); background:radial-gradient(120% 70% at 50% 35%, color-mix(in srgb, var(--pc) 22%, var(--bg)) 0%, var(--bg) 70%)}
.pomo.rest{--pc:var(--rest)}
.pomo .top{display:flex; justify-content:space-between; align-items:center}
.pomo .phase{font-size:.78rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--pc)}
.bigring{position:relative; width:min(78vw, 330px); aspect-ratio:1; margin:30px auto 10px; max-width:100%}
.bigring svg{width:100%; height:100%; transform:rotate(-90deg)}
.bigring .t{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.bigring .clock{font-family:var(--f-display); font-weight:700; font-size:clamp(4.2rem, 22vw, 6.4rem); line-height:.9; letter-spacing:.01em}
.bigring .proj{color:var(--muted); font-weight:600; margin-top:6px}
.pdots{display:flex; gap:8px; justify-content:center; margin:6px 0 4px}
.pdots i{width:10px; height:10px; border-radius:50%; border:2px solid var(--pc)}
.pdots i.d{background:var(--pc)}
.quota{text-align:center; color:var(--muted); font-size:.9rem}
.quota b{color:var(--fg)}
.pctl{display:flex; justify-content:center; align-items:center; gap:22px; margin-top:auto; padding-top:28px}
.pctl button{border:none; border-radius:50%; display:grid; place-items:center}
.pctl .s{width:62px; height:62px; background:var(--surface2); color:var(--fg); font-size:.72rem; font-weight:700; letter-spacing:.06em}
.pctl .m{width:86px; height:86px; background:var(--pc)}
.pctl .m svg{width:30px; height:30px; fill:#fff}
.closex{border:1px solid var(--line); background:var(--surface); width:40px; height:40px; border-radius:12px; font-size:1.2rem}
.steps{display:flex; gap:6px; margin:14px 0 18px}
.steps i{flex:1; height:4px; border-radius:2px; background:var(--line)}
.steps i.on{background:var(--accent)}
.rv h2{font-family:var(--f-display); font-weight:800; font-size:2rem; text-transform:uppercase; margin:0 0 4px}
.rv p.lead{color:var(--muted); margin:0 0 16px}
.choice{display:flex; gap:4px; flex-wrap:wrap; margin-top:6px}
.choice button{border:1px solid var(--line); background:var(--surface2); border-radius:8px; padding:5px 9px; font-size:.75rem; font-weight:600}
.choice button.on{background:var(--accent); border-color:var(--accent); color:#fff}
.searchbar{display:flex; gap:8px; align-items:center; margin-bottom:14px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--fg); color:var(--bg); padding:10px 14px; border-radius:12px; font-weight:600; font-size:.86rem; max-width:calc(100vw - 32px); width:max-content}
.note{font-size:.8rem; color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:10px 12px; margin-top:12px}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(30px); opacity:.6}} }

/* nota del día, festivos, vista por horas, mes con nombres, hoja de número */
.dnote{width:100%; border:1px dashed var(--line); background:transparent; border-radius:10px; padding:7px 9px; font-size:.8rem; color:var(--fg); resize:vertical; min-height:34px; margin-top:8px}
.dnote::placeholder{color:var(--faint)}
.holi{display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:700; color:var(--hi); background:color-mix(in srgb, var(--hi) 14%, transparent); border-radius:6px; padding:2px 7px; margin-bottom:6px}
.daypick{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin-bottom:12px}
.daypick button{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:6px 2px; display:flex; flex-direction:column; align-items:center; font-size:.68rem; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.daypick button b{font-family:var(--f-display); font-size:1.3rem; color:var(--fg); letter-spacing:0}
.daypick button.on{background:var(--accent); border-color:var(--accent); color:#fff} .daypick button.on b{color:#fff}
.daypick button .tl{margin-top:3px}
.dayview{display:grid; grid-template-columns:1fr; gap:12px}
.hgrid{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px 10px 8px 52px; height:calc(16 * 52px + 16px)}
.hline{position:absolute; left:0; right:0; height:52px; border-top:1px solid var(--line)}
.hline span{position:absolute; left:10px; top:-8px; font-size:.7rem; color:var(--faint); background:var(--surface); padding:0 4px; font-weight:600}
.hblk{position:absolute; left:52px; right:10px; border-radius:10px; padding:6px 10px; background:color-mix(in srgb, var(--bc) 26%, var(--surface)); border-left:4px solid var(--bc); overflow:hidden; font-size:.82rem}
.hblk b{display:block; font-weight:700}
.hblk.task{left:calc(52px + 40%); background:var(--surface2); border-left-color:var(--bc)}
.hnow{position:absolute; left:46px; right:6px; height:2px; background:var(--work); z-index:2}
.hnow::before{content:""; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--work)}
.mtxt{display:none}
.numpad{display:flex; gap:8px; align-items:center}
.numpad .inp{font-family:var(--f-display); font-size:2.2rem; font-weight:700; text-align:center; padding:8px}
.auto-tag{font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.ring.auto .rw::after{content:"auto"; position:absolute; bottom:-2px; right:-6px; font-size:.55rem; font-weight:800; background:var(--accent); color:#fff; border-radius:5px; padding:0 4px; text-transform:uppercase}
.ring.week small::after{content:" · sem"; color:var(--accent); font-weight:700}


/* entreno */
.trday{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-left:6px solid var(--rc); border-radius:14px; padding:10px 12px}

.trd{display:flex; flex-direction:column; align-items:center; min-width:42px}
.trd b{font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.trd span{font-family:var(--f-display); font-weight:700; font-size:1.5rem; line-height:1}
.trbody{border:none; background:none; text-align:left; display:flex; flex-direction:column; gap:2px; padding:0}
.trname{font-family:var(--f-display); font-weight:700; font-size:1.3rem; text-transform:uppercase; letter-spacing:.02em}
.body{flex:none; height:auto; max-width:40%}
.sets{width:100%; border-collapse:collapse; margin-top:10px; font-variant-numeric:tabular-nums}
.sets th{font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center; padding:4px; font-weight:700}
.sets td{text-align:center; padding:4px; border-top:1px solid var(--line)}
.inp.sm{padding:7px 6px; text-align:center; width:100%; max-width:90px; font-weight:600}
.stype{width:32px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); font-weight:800; font-size:.8rem}
.stype.tC{color:var(--mid); border-color:color-mix(in srgb, var(--mid) 50%, var(--line))} .stype.tF{color:var(--hi); border-color:color-mix(in srgb, var(--hi) 50%, var(--line))} .stype.tD{color:#B48CFF; border-color:color-mix(in srgb, #B48CFF 50%, var(--line))}
.setok{width:38px; height:38px; border-radius:10px; border:2px solid var(--line); background:var(--surface2); display:grid; place-items:center}
.setok svg{width:18px; height:18px; stroke:var(--muted); stroke-width:3; fill:none}
.setok.on{background:var(--lo); border-color:var(--lo)} .setok.on svg{stroke:#fff}
.wkset tr.done td{background:color-mix(in srgb, var(--lo) 10%, transparent)}
.x{border:none; background:transparent; color:var(--muted); font-size:1.1rem}
.sugg{margin-top:12px; padding:10px 12px; border-radius:12px; border:1px solid color-mix(in srgb, var(--lo) 50%, var(--line)); background:color-mix(in srgb, var(--lo) 10%, var(--surface)); font-size:.88rem; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.wk{background:var(--bg)}
.wktop{display:flex; align-items:center; gap:10px}
.wkclock{font-family:var(--f-display); font-weight:700; font-size:1.6rem; line-height:1}
.wkname{font-family:var(--f-display); font-weight:800; font-size:2rem; text-transform:uppercase; margin:0; line-height:1}
.wkex{display:flex; gap:6px; overflow-x:auto; margin-top:16px; padding-bottom:4px; scrollbar-width:none}
.wkex button{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:.78rem; font-weight:600; color:var(--muted)}
.wkex button.ok{color:var(--lo); border-color:color-mix(in srgb, var(--lo) 50%, var(--line))}
.wkex button.on{background:var(--rc); color:#fff; border-color:var(--rc)}
.exgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:8px}
.excard{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; text-align:left; width:100%}
.excard b{display:block; font-weight:700}
button.excard:hover{border-color:var(--accent)}
.vrow{display:grid; grid-template-columns:90px minmax(0,1fr) 28px; gap:10px; align-items:center; font-size:.84rem}
.vbar{position:relative; height:12px; border-radius:6px; background:var(--surface2); overflow:hidden}
.vbar .band{position:absolute; left:40%; width:40%; top:0; bottom:0; background:color-mix(in srgb, var(--lo) 16%, transparent)}
.vbar b{position:absolute; left:0; top:3px; bottom:3px; border-radius:3px}
.vnum{font-weight:700; text-align:right}
.wbars{display:grid; grid-template-columns:repeat(8,1fr); gap:8px; align-items:end; height:130px; margin-top:12px}
.wbars div{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px}
.wbars b{width:100%; max-width:36px; border-radius:6px 6px 2px 2px}
.wbars span{font-size:.7rem; color:var(--muted)}

/* comidas */
.lights{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin:10px 0 8px}
.lights div{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.72rem; color:var(--muted)}
.tl{display:inline-block; width:14px; height:14px; border-radius:50%; flex:none}
.lights .tl{width:22px; height:22px}
.kpis4{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:8px}
.kpis4 b{display:block; font-family:var(--f-display); font-weight:700; font-size:1.9rem; line-height:1}
.kpis4 small{color:var(--muted); font-size:.74rem}
.panbars{position:relative; grid-template-columns:repeat(7,1fr)}
.panbars .limit{position:absolute; left:0; right:0; border-top:2px dashed var(--hi); opacity:.7}
.lgrow{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.lgrow b{min-width:24px; text-align:center}
.lgrow.unk{color:var(--mid)}
.menugrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:8px}
.menucell{display:flex; gap:8px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--surface2); border-radius:12px; padding:9px 10px; font-size:.86rem; font-weight:600; width:100%}

.shoprow{display:flex; align-items:center; gap:10px; border:none; background:transparent; padding:7px 2px; text-align:left; width:100%; border-bottom:1px solid var(--line)}
.shoprow .chk{width:22px; height:22px}
.shoprow.on .chk{background:var(--lo)} .shoprow.on .chk svg{opacity:1}
.shoprow.on .grow{text-decoration:line-through; color:var(--muted)}
@media (min-width:700px){ .kpis4{grid-template-columns:repeat(4,minmax(0,1fr))} .menugrid{grid-template-columns:repeat(4,minmax(0,1fr))} }

/* progreso, calendario unido, deshacer */
.statgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.statgrid .stat b{font-size:1.7rem}
@media (min-width:700px){ .statgrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.dots i.sq{border-radius:2px; width:8px; height:8px}
.mtxt span.train{background:transparent; border:1.5px solid var(--dc); border-left-width:4px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:.66rem}
.mtxt span.train::before{content:"▪ "; opacity:.8}
.mtxt span.train.plan{border-style:dashed; border-left-style:solid}
.trainev{border:1.5px solid var(--dc); border-left-width:6px; background:transparent}
.trainev .sect{display:block; font-size:.62rem}
.toast .undo{margin-left:8px; border:none; background:transparent; color:var(--accent); font-weight:800; padding:0; text-decoration:underline}

/* semana en columnas verticales */
.wcols{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(178px, 1fr); gap:8px; overflow-x:auto; scroll-snap-type:x proximity; padding-bottom:6px}
.wcol{scroll-snap-align:start; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:6px; min-height:380px; min-width:0}
.wcol.today{border-color:var(--accent); border-width:2px}
.wcol.past{opacity:.85}
.wch{display:flex; align-items:baseline; justify-content:space-between; padding:2px 4px}
.wch span{font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.wch b{font-family:var(--f-display); font-size:1.7rem; line-height:1}
.wcol .lbar{margin:0}
.wload{font-size:.68rem; color:var(--muted); text-align:right; margin-top:-2px}
.wload.over{color:var(--hi); font-weight:700}
.wfx{font-size:.7rem; font-weight:600; border-radius:6px; padding:3px 6px; background:color-mix(in srgb, var(--bc) 22%, var(--surface)); border-left:3px solid var(--bc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tchip{display:flex; gap:7px; align-items:flex-start; background:var(--surface2); border-radius:10px; padding:8px 8px 8px 11px; position:relative; cursor:pointer; overflow:hidden}
.tchip::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tc)}
.tchip .chk{width:20px; height:20px}
.tchip.done .chk{background:var(--tc)} .tchip.done .chk svg{opacity:1}
.tchip.done .tc-t{text-decoration:line-through; color:var(--muted)}
.tchip:hover, .tchip:focus-visible{background:color-mix(in srgb, var(--tc) 14%, var(--surface2))}
.tc-body{display:flex; flex-direction:column; gap:2px; min-width:0}
.tc-t{font-size:.82rem; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tc-m{font-size:.68rem; color:var(--muted); display:flex; align-items:center; gap:4px}
.pdot{width:7px; height:7px; border-radius:50%; display:inline-block}
.pdot.alta{background:var(--hi)} .pdot.media{background:var(--mid)} .pdot.baja{background:var(--lo)}
.pop{position:fixed; z-index:45; width:270px; max-width:calc(100vw - 16px); background:var(--surface); border:1px solid var(--line); border-top:5px solid var(--tc); border-radius:14px; padding:12px 14px; box-shadow:0 18px 40px -14px rgba(0,0,0,.55)}
.pop-t{font-weight:700; font-size:1rem}
.pop-row{display:flex; justify-content:space-between; gap:10px; font-size:.82rem; padding:3px 0; border-bottom:1px dashed var(--line)}
.pop-row span{color:var(--muted)}
.pop-subs{margin-top:6px; font-size:.8rem; display:flex; flex-direction:column; gap:2px}
.pop-subs .ok{color:var(--muted); text-decoration:line-through}

.pop-act{display:flex; gap:6px; margin-top:10px}
@media (min-width:1100px){ .wcols{grid-auto-flow:row; grid-template-columns:repeat(7,minmax(0,1fr)); overflow:visible} }
/* entreno: músculos e historial */
.mtop{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rank{display:flex; align-items:baseline; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line)}
.rank b{font-family:var(--f-display); font-size:1.1rem; color:var(--lo); min-width:16px}
.rank .big{font-family:var(--f-display); font-weight:700; font-size:1.5rem}
.rank small{color:var(--muted); font-size:.7rem}
.tgrow{padding:10px 0; border-top:1px solid var(--line)}
.tgrow .big{font-family:var(--f-display); font-weight:700; font-size:1.5rem}
.tgrow .big small{font-size:.8rem; color:var(--muted); font-family:var(--f-body); font-weight:600}
.huge{font-family:var(--f-display); font-weight:800; font-size:3.4rem; line-height:.9}
.wkdots{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:12px}
.wkdots div{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.7rem; color:var(--muted)}
.wkdots i{width:26px; height:26px; border-radius:8px}
.wtable{width:100%; border-collapse:collapse; margin-top:8px; font-size:.86rem}
.wtable td{padding:7px 4px; border-top:1px solid var(--line)}
.wtable td:nth-child(2){font-family:var(--f-display); font-size:1.15rem; white-space:nowrap}
.wtable td:nth-child(3){width:30%}
.wtable td:nth-child(4), .wtable td:nth-child(5){text-align:right; white-space:nowrap}
.minibar{height:6px; background:var(--surface2); border-radius:3px; overflow:hidden}
.minibar i{display:block; height:100%}
.donetag{font-weight:700; color:var(--lo); font-size:.85rem}
/* comidas: calidad */
.huge + .huge{margin-left:2px}
.reasons{display:flex; flex-direction:column; gap:4px; margin-top:10px; font-size:.9rem}
.reasons .ok{color:var(--lo)} .reasons .ko{color:var(--mid)}
.bnum{font-style:normal; font-size:.66rem; color:var(--muted); font-weight:700}
.wbars div{position:relative}
.vchip{display:inline-flex; gap:5px; align-items:center; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:.8rem; background:var(--surface2)}
.vchip.much{border-color:var(--mid); color:var(--mid)} .vchip.none{opacity:.55}
.rep{display:block; font-style:normal; font-size:.7rem; color:var(--mid); font-weight:700; margin-top:2px}
.mechk{font-size:.84rem; font-weight:600; margin-top:6px; line-height:1.5}
.shopcard{margin-bottom:10px; background:color-mix(in srgb, var(--sc) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--sc) 45%, var(--line)); padding-top:0; overflow:hidden}
.shoph{display:flex; justify-content:space-between; align-items:center; margin:0 -22px; padding:10px 22px; background:var(--sc); color:#fff; font-family:var(--f-display); font-weight:700; font-size:1.2rem; text-transform:uppercase; letter-spacing:.03em}

.cdot{width:16px; height:16px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1.5px var(--line); padding:0}
/* pantallas anchas: todo en una sola columna, pero más ancha y con más aire */
@media (min-width:700px){
  body{font-size:16px}
  .app{padding-left:max(28px, env(safe-area-inset-left,0px)); padding-right:max(28px, env(safe-area-inset-right,0px))}

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const add = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dow = d => (d.getDay()+6)%7;
const monday = d => add(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -dow(d));

const nf = (v, d=1) => Number(v).toLocaleString('es-ES', {maximumFractionDigits:d});
const ICON = {
  hoy:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  agenda:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

  play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>'
};
const PALETTE = ['#5B93FF','#3FD0E0','#2BD4A4','#3DDC84','#A3E635','#FFB23F','#FF7A3D','#FF5A68','#FF6FA5','#B48CFF','#C08457','#8E9AAF'];

// ---------- datos ----------
const T = new Date(); const TS = fmt(T); const W = monday(T); const D = n => fmt(add(W, n)); const TD = n => fmt(add(T, n));
let cats = [
  {id:'trabajo', n:'Trabajo', c:'#8E9AAF'}, {id:'estudio', n:'Estudio', c:'#B48CFF'}, {id:'casa', n:'Casa', c:'#C08457'},
  {id:'personal', n:'Personal', c:'#FF6FA5'}, {id:'recados', n:'Recados', c:'#FFB23F'}

let projects = [];
let tasks = [];
let fixed = [];
const trips = [];
let holidays = {'2026-12-06':'Día de la Constitución', '2026-12-08':'Inmaculada Concepción', '2026-12-25':'Navidad', '2027-01-01':'Año Nuevo', '2027-01-06':'Reyes', '2026-11-09':'Almudena (Madrid)'};

let timed = {}; // tareas con hora opcional (id -> hora)

  {id:'g3', t:'Ofertas de trabajo', kind:'num', per:'dia', g:3, u:'', step:1, c:'#5B93FF', log:{}},
  {id:'g4', t:'Gimnasio', kind:'auto', src:'entreno', per:'semana', g:5, u:'veces', c:'#3DDC84', log:{}}
];
const SRC = {entreno:'tus entrenos', pomodoro:'el Pomodoro', comidas:'lo que apuntas en Comidas'};
const GOAL_SUG = [{t:'Pasos', kind:'num', g:10000, u:'pasos'}, {t:'Meditar', kind:'num', g:10, u:'min'}, {t:'Dormir', kind:'num', g:8, u:'h'}, {t:'Estirar', kind:'check', g:1, u:''}, {t:'Leer esta semana', kind:'num', per:'semana', g:70, u:'pág'}];

// comidas: personas con su peso y su ingesta

// ---------- estado de la interfaz ----------
let tab = 'hoy', dsel = TS, aview = 'semana', bfilter = 'all', bcol = 'semana', msel = TS, mcur = new Date(T.getFullYear(), T.getMonth(), 1), ecur = new Date(T.getFullYear(), T.getMonth(), 1), esel = TS;
let editHome = false, order = ['entreno','enfoque','objetivos','horario','tareas','comidas','sueno'], hiddenCards = new Set();
let pomo = null, review = null, sheetTask = null;
let mode = document.documentElement.getAttribute('data-mode') || 'auto';

const fixedOn = ds => { const d = parse(ds); return fixed.filter(f => f.date ? f.date === ds : f.days.includes(dow(d))).sort((a,b) => a.from.localeCompare(b.from)); };
const freeMin = ds => 14*60 - fixedOn(ds).reduce((a,f) => a + Math.max(0, Math.min(toMin(f.to), 22*60) - Math.max(toMin(f.from), 8*60)), 0);
const taskRemaining = t => t.subs ? t.subs.filter(s => !s.done).reduce((a,s) => a + s.d, 0) : t.dur;
const loadMin = ds => tasks.filter(t => t.plan === ds && !t.done).reduce((a,t) => a + taskRemaining(t), 0);
const pj = id => projects.find(p => p.id === id);
const cat = id => cats.find(c => c.id === id);
const colorOf = t => (t.pj && pj(t.pj) ? pj(t.pj).c : (cat(t.cat) || {c:'#8E9AAF'}).c);
const prioRank = {alta:0, media:1, baja:2};
const byPrio = (a,b) => (a.done?1:0) - (b.done?1:0) || prioRank[a.p] - prioRank[b.p];
const shortD = s => { const d = parse(s); return d.getDate()+' '+MES[d.getMonth()]; };
const relD = s => s === TS ? 'hoy' : s === TD(1) ? 'mañana' : shortD(s);
const swatches = (cur, attr) => '<div class="sw">' + PALETTE.map(c => '<button type="button" class="' + (c === cur ? 'on' : '') + '" style="--c:' + c + '" ' + attr + '="' + c + '" aria-label="Color ' + c + '"></button>').join('') + '</div>';

function taskMeta(t, showPj){
  const p = t.pj ? pj(t.pj) : null, c = cat(t.cat), meta = ['<span class="prio ' + t.p + '">' + t.p + '</span>'];
  if (p && showPj) meta.push('<span class="badge pj">' + esc(p.n) + '</span>'); else if (!p && c) meta.push('<span class="badge pj">' + esc(c.n) + '</span>');

  if (t.subs) meta.push('<span>' + t.subs.filter(s => s.done).length + '/' + t.subs.length + ' pasos</span>');

}
function taskRow(t){
  return '<div class="task' + (t.done ? ' done' : '') + '" style="--tc:' + colorOf(t) + '" data-task="' + t.id + '" draggable="true">' +
    '<button class="chk" type="button" data-toggle="' + t.id + '" aria-label="Marcar ' + esc(t.t) + '">' + ICON.check + '</button>' +
    '<div class="grow"><div class="tt">' + esc(t.t) + '</div><div class="tm">' + taskMeta(t, true) + '</div></div>' +
    '<span class="dur">' + hm(taskRemaining(t)) + '</span></div>';
}

// ---------- comidas: cálculos ----------

// ---------- HOY ----------
function homeCard(id){
  if (id === 'entreno'){
    const ty = PLAN[dow(T)];
    if (ty){ const x = TYPES[ty];
      const gym = fixed.find(f => /gim/i.test(f.t) && fixedOn(TS).includes(f)), dn = doneDays.has(TS);
      return '<div class="card tap" data-goto="entreno" style="border-left:5px solid ' + x.c + '"><div class="eyebrow"><span>Entreno de hoy</span>' + (dn ? '<span style="color:var(--lo)">Hecho ✓</span>' : '') + '</div><div class="row"><div class="grow"><h3>' + esc(x.l) + '</h3><div class="meta">' + (x.ex > 1 ? x.ex + ' ejercicios · ' : '') + '~' + x.min + ' min' + (gym ? ' · ' + gym.from : '') + '</div></div>' + (dn ? '' : '<button class="play" type="button" data-workout="' + ty + '" aria-label="Empezar entreno">' + ICON.play + '</button>') + '</div></div>'; }

    const nx = TYPES[PLAN[(dow(T)+n)%7]];
    if (!nx) return '<div class="card tap" data-goto="entreno"><div class="eyebrow"><span>Entreno de hoy</span></div><h3>Descanso</h3><div class="meta">Elige tu semana en Entreno.</div></div>';
    return '<div class="card tap" data-goto="entreno"><div class="eyebrow"><span>Entreno de hoy</span></div><h3>Descanso</h3><div class="meta">Próximo: ' + nx.l + ' ' + (n === 1 ? 'mañana' : 'el ' + WDL[(dow(T)+n)%7]) + '</div></div>';
  }
  if (id === 'enfoque') return enfoqueCard();
  if (id === 'objetivos'){
    const met = goals.filter(g => gv(g) >= g.g).length;
    return '<div class="card"><div class="eyebrow"><span>Objetivos · ' + met + ' de ' + goals.length + '</span><button class="mini" type="button" data-goals>Elegir</button></div>' +
      (goals.length ? '<div class="rings">' + goals.map(g =>
      '<button type="button" class="ring' + (g.kind === 'auto' ? ' auto' : '') + (g.per === 'semana' ? ' week' : '') + '" data-goal="' + g.id + '" style="--rc:' + g.c + '" aria-label="' + esc(g.t) + '"><div class="rw"><div class="r" style="--p:' + Math.min(1, gv(g)/g.g).toFixed(3) + '"></div><span>' + (gv(g) >= g.g ? '✓' : nf(gv(g))) + '</span></div><small>' + esc(g.t) + '<br>' + nf(gv(g)) + '/' + nf(g.g) + (g.u ? ' ' + esc(g.u) : '') + '</small></button>').join('') + '</div><div class="meta" style="margin-top:8px;font-size:.76rem">Un toque suma · mantén pulsado para escribir el número · <span class="auto-tag">auto</span> se rellena solo</div>'
      : '<div class="empty">Sin objetivos. Pulsa «Elegir».</div>') + '</div>';
  }
  if (id === 'horario'){
    const fx = fixedOn(TS), pos = m => Math.max(0, Math.min(100, (m - 8*60) / (14*60) * 100));
    const nowM = T.getHours()*60 + T.getMinutes();
    return '<div class="card"><div class="eyebrow"><span>Horario fijo</span><span>' + hm(freeMin(TS)) + ' libres</span></div><div class="strip">' +
      fx.map(f => '<div class="blk" style="--bc:' + f.c + ';left:' + pos(toMin(f.from)) + '%;width:' + (pos(toMin(f.to)) - pos(toMin(f.from))) + '%" title="' + esc(f.t + ' ' + f.from + '–' + f.to) + '">' + esc(f.t) + '</div>').join('') +
      (nowM > 480 && nowM < 1320 ? '<div class="now" style="left:' + pos(nowM) + '%"></div>' : '') + '</div><div class="hours"><span>8</span><span>11</span><span>14</span><span>17</span><span>20</span><span>22</span></div>' +
      '<div class="list" style="margin-top:10px">' + (fx.map(f => '<div class="ev" style="--dc:' + f.c + '"><span class="h">' + f.from + '</span><span class="grow">' + esc(f.t) + '</span><span class="meta">hasta ' + f.to + '</span></div>').join('') || '<div class="empty">Sin horarios hoy.</div>') + '</div></div>';
  }
  if (id === 'tareas'){
    const list = tasks.filter(t => t.plan === TS).sort(byPrio), load = loadMin(TS), free = freeMin(TS);
    return '<div class="card"><div class="eyebrow"><span>Tareas de hoy</span><span style="' + (load > free ? 'color:var(--hi)' : '') + '">' + hm(load) + ' de ' + hm(free) + ' libres</span></div><div class="list" style="margin-top:10px">' +
      (list.length ? list.map(taskRow).join('') : '<div class="empty">Nada planificado. Elige tareas en Agenda → Semana.</div>') + '</div></div>';
  }
  if (id === 'sueno'){
    if (!sleep.length) return '<div class="card"><div class="eyebrow"><span>Sueño</span><button class="mini" type="button" data-sleeplog>Apuntar anoche</button></div><div class="empty">Apunta a qué hora te acostaste y te levantaste.</div></div>';

    return '<div class="card tap" data-goto="comidas" style="border-left:5px solid ' + scoreC(sc) + '"><div class="eyebrow"><span>Comida de hoy</span><span>≈' + nf(t.kcal,0) + ' kcal</span></div><div class="row" style="align-items:baseline;margin-top:4px"><h3 style="color:' + scoreC(sc) + '">' + (sc === null ? '–' : nf(sc)) + '<span style="font-size:1rem;color:var(--muted)">/10</span></h3><b>' + scoreN(sc) + '</b></div><div class="lights">' + MEALS.map(m => { const v = mealScore(day[m]); return '<div>' + sdot(v) + '<span>' + m + (v === null ? '' : ' ' + nf(v)) + '</span></div>'; }).join('') + '</div></div>';
  }
  return '';
}
const CARDN = {entreno:'Entreno', enfoque:'Enfoque', objetivos:'Objetivos', horario:'Horario fijo', tareas:'Tareas', comidas:'Comidas', sueno:'Sueño'};
function renderHoy(){
  const left = tasks.filter(t => t.plan === TS && !t.done);
  let h = '<div class="hdr"><div><h1>' + WDL[dow(T)] + ' ' + T.getDate() + '</h1><div class="sub">Te quedan <b>' + left.length + ' tareas</b> · ' + hm(left.reduce((a,t) => a + taskRemaining(t), 0)) + '</div></div>' +
    '<button class="pill-btn' + (editHome ? ' on' : '') + '" type="button" data-edit-home>' + (editHome ? 'Listo' : 'Editar') + '</button></div>';
  const vis = order.filter(id => !hiddenCards.has(id));
  if (dow(T) === 6) h += '<div class="card tap" data-review style="border-left:5px solid var(--accent);margin-bottom:10px"><div class="eyebrow"><span>Es domingo</span></div><h3>Revisión de la semana</h3><div class="meta">Dos minutos para cerrar la semana y preparar la siguiente</div></div>';
  const card = (id) => { let c = homeCard(id); if (editHome){ const i = order.indexOf(id); c = c.replace(/<\/div>$/, '<div class="edit-ctl"><button type="button" data-mv="' + id + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + '>Subir</button><button type="button" data-mv="' + id + '" data-dir="1"' + (i === order.length-1 ? ' disabled' : '') + '>Bajar</button><button type="button" data-hide="' + id + '">Ocultar</button></div></div>'); } return c; };
  const half = Math.ceil(vis.length / 2);
  h += '<div class="home-grid"><div class="stack">' + vis.slice(0, half).map(card).join('') + '</div><div class="stack" style="margin-top:10px">' + vis.slice(half).map(card).join('') + '</div></div>';
  if (editHome && hiddenCards.size) h += '<div class="hidden-list" style="margin-top:12px">Ocultos: ' + [...hiddenCards].map(id => '<button class="pill-btn" type="button" data-show="' + id + '">+ ' + CARDN[id] + '</button>').join('') + '</div>';
  if (editHome) h += '<div class="note">Cambia el orden de los bloques u oculta los que no uses.</div>';

}

// ---------- AGENDA ----------
function renderAgenda(){
  let h = '<div class="hdr"><div><h1>Agenda</h1><div class="sub">Semana del ' + W.getDate() + ' al ' + add(W,6).getDate() + ' de ' + MESL[add(W,6).getMonth()] + '</div></div><button class="icon-btn" type="button" data-search aria-label="Buscar">' + ICON.search + '</button></div>';
  h += '<div class="seg" role="tablist">' + [['dia','Día'],['semana','Semana'],['tablero','Proyectos'],['mes','Mes']].map(([k,l]) => '<button type="button" data-aview="' + k + '" class="' + (aview === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
  if (aview === 'dia') h += dayView(); else if (aview === 'semana') h += weekView(); else if (aview === 'tablero') h += boardView(); else h += monthView();
  $('#main').innerHTML = h;
}
function dayView(){
  const d = parse(dsel), H0 = 7, HH = 52;
  let h = '<div class="daypick">' + [0,1,2,3,4,5,6].map(i => { const x = D(i); return '<button type="button" class="' + (x === dsel ? 'on' : '') + '" data-dsel="' + x + '">' + WD[i] + '<b>' + add(W,i).getDate() + '</b></button>'; }).join('') + '</div>';
  const fx = fixedOn(dsel), tl = tasks.filter(t => t.plan === dsel).sort(byPrio);
  const top = t => (toMin(t) - H0*60) / 60 * HH + 8;
  let grid = '<div class="hgrid">' + Array.from({length:16}, (_,i) => '<div class="hline" style="top:' + (i*HH + 8) + 'px"><span>' + pad(H0+i) + ':00</span></div>').join('');
  fx.forEach(f => { grid += '<div class="hblk" style="--bc:' + f.c + ';top:' + top(f.from) + 'px;height:' + Math.max(24, top(f.to) - top(f.from) - 2) + 'px"><b>' + esc(f.t) + '</b>' + f.from + '–' + f.to + '</div>'; });
  tl.filter(t => timed[t.id]).forEach(t => { const st = timed[t.id], en = pad(Math.floor((toMin(st) + t.dur)/60)) + ':' + pad((toMin(st) + t.dur) % 60);
    grid += '<div class="hblk task" data-task="' + t.id + '" style="--bc:' + colorOf(t) + ';top:' + top(st) + 'px;height:' + Math.max(26, top(en) - top(st) - 2) + 'px;cursor:pointer"><b>' + esc(t.t) + '</b>' + st + ' · ' + hm(t.dur) + '</div>'; });

function lineChart(hist){

    '<table class="sets wkset"><thead><tr><th>Serie</th><th>Anterior</th><th>' + labs(e)[0] + '</th><th>' + labs(e)[1] + '</th><th>' + (e.cardio ? '' : 'RIR') + '</th><th></th></tr></thead><tbody>' + x.sets.map((s, j) => { const p = x.prev[j];
      return '<tr class="' + (s.done ? 'done' : '') + '"><td><button type="button" class="stype t' + s.type + '" data-wtype="' + j + '" title="' + SETT[s.type] + '">' + (s.type === 'N' ? j + 1 : s.type) + '</button></td><td class="meta">' + (p ? nf(p.kg) + '×' + p.reps : '—') + '</td>' +

function bindWorkout(){
  $('#layer').oninput = e => { if (!wk) return; const el = e.target, x = wk.ex[wk.idx];
    if (el.dataset.wkg !== undefined){ x.sets[+el.dataset.wkg].kg = Number(el.value) || 0; }
    if (el.dataset.wreps !== undefined){ x.sets[+el.dataset.wreps].reps = Number(el.value) || 0; }
    if (el.dataset.wknotein !== undefined) x.note = el.value; };
  $('#layer').onchange = e => { const el = e.target; if (wk && el.dataset.wrir !== undefined) wk.ex[wk.idx].sets[+el.dataset.wrir].rir = el.value; };
  $('#layer').onclick = e => {
    const b = e.target.closest('button'); if (!b || !wk) return; const d = b.dataset, x = wk.ex[wk.idx];
    if (d.wdone !== undefined){ const s = x.sets[+d.wdone]; s.done = !s.done; drawWorkout(); if (s.done) startRest(x.rest); }
    else if (d.wtype !== undefined){ const o = ['C','N','F','D'], s = x.sets[+d.wtype]; s.type = o[(o.indexOf(s.type)+1) % 4]; wk.changed = true; drawWorkout(); }
    else if (d.wadd !== undefined){ const l = x.sets[x.sets.length-1]; x.sets.push({type:'N', kg:l.kg, reps:l.reps, rir:'', done:false}); wk.changed = true; drawWorkout(); }
    else if (d.wrem !== undefined){ x.sets.pop(); wk.changed = true; drawWorkout(); }
    else if (d.wkup){ x.sets.forEach(s => { if (s.type !== 'C' && !s.done) s.kg = Math.round((s.kg + Number(d.wkup)) * 10) / 10; }); drawWorkout(); toast('Peso subido en las series pendientes'); }
    else if (d.wgo !== undefined){ wk.idx = +d.wgo; drawWorkout(); }
    else if (d.wnext !== undefined){ wk.idx++; drawWorkout(); window.scrollTo(0,0); }
    else if (d.wprev !== undefined){ wk.idx--; drawWorkout(); }
    else if (d.wknote !== undefined){ x.noteOpen = !x.noteOpen; drawWorkout(); }
    else if (d.wksub !== undefined){ pickExercise(exOf(x.ex).m[0], id => { x.ex = id; x.prev = []; wk.changed = true; drawWorkout(); bindWorkout(); }, () => { drawWorkout(); bindWorkout(); }); }
    else if (d.wkquit !== undefined){ wk.quit = true; drawWorkout(); }
    else if (d.wkquitno !== undefined){ wk.quit = false; drawWorkout(); }
    else if (d.wkquityes !== undefined){ endWorkout(); closeLayer(); toast('Entreno descartado'); }
    else if (d.wkfinish !== undefined){ drawSummary(); }
    else if (d.wkall !== undefined){ wk.ex.forEach(y => y.sets.forEach(st => st.done = true)); drawSummary(); }
    else if (d.wksave){ if (d.wksave === 'si'){ const r = rtn(wk.rid); r.ex = wk.ex.map(y => ({ex:y.ex, rest:y.rest, sets:y.sets.map(s => ({type:s.type, kg:s.kg, reps:s.reps}))})); }
      saveSession();
      endWorkout(); closeLayer(); toast(d.wksave === 'si' ? 'Entreno guardado y rutina actualizada' : 'Entreno guardado'); }
  };
}

function startRest(sec){
  stopRest();
  const el = document.createElement('div'); el.className = 'full pomo rest'; el.id = 'rest'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Descanso'); el.style.zIndex = 55;
  document.body.appendChild(el);
  restT = {left:sec, total:sec};
  const draw = () => { const C = 2*Math.PI*46;
    el.innerHTML = '<div class="in"><div class="top"><span class="phase">Descanso</span><button class="closex" type="button" data-rskip aria-label="Saltar descanso">×</button></div>' +
      '<div class="bigring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--surface2)" stroke-width="4"/><circle cx="50" cy="50" r="46" fill="none" stroke="var(--pc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - restT.left / restT.total)) + '"/></svg><div class="t"><div class="clock">' + mmss(restT.left / 60) + '</div><div class="proj">Siguiente: serie ' + (wk ? wk.ex[wk.idx].sets.filter(s => s.done).length + 1 : '') + '</div></div></div>' +
      '<div class="pctl"><button class="s" type="button" data-radd="-15">−15 s</button><button class="m" type="button" data-rskip aria-label="Saltar">' + ICON.play + '</button><button class="s" type="button" data-radd="15">+15 s</button></div></div>';
  };
  draw();
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.radd){ restT.left = Math.max(5, restT.left + Number(b.dataset.radd)); restT.total = Math.max(restT.total, restT.left); draw(); }
    else if (b.hasAttribute('data-rskip')) stopRest(); };
  restT.iv = setInterval(() => { restT.left--; if (restT.left <= 0){ try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(_){} stopRest(); toast('¡A por la siguiente serie!'); return; } draw(); }, 1000);
}
function stopRest(){ if (restT){ clearInterval(restT.iv); restT = null; } const el = document.getElementById('rest'); if (el) el.remove(); }

    '<div class="fld"><label for="gn">Llevas</label><div class="numpad"><input class="inp" id="gn" type="number" inputmode="decimal" step="any" value="' + gv(g) + '"><span class="meta" style="font-size:1rem">' + esc(g.u) + '</span></div></div>' +

        [['dia','Diario'],['semana','Semanal']].map(([k,l]) => '<button type="button" class="opt' + ((g.per || 'dia') === k ? ' on' : '') + '" data-gper="' + k + '" data-gid2="' + g.id + '">' + l + '</button>').join('') + '</div>' +
        (g.kind === 'auto' ? '<div class="opts" style="grid-column:1 / -1"><span class="meta" style="align-self:center">Se rellena con:</span>' + Object.entries({entreno:'Entreno', pomodoro:'Pomodoro'}).map(([k,l]) => '<button type="button" class="opt' + (g.src === k ? ' on' : '') + '" data-gsrc="' + k + '" data-gid2="' + g.id + '">' + l + '</button>').join('') + '</div>' : '') +

      '<div class="fld" style="margin-top:14px"><span class="lab">Añadir</span><div class="opts">' + GOAL_SUG.filter(s => !goals.some(g => g.t === s.t)).map((s,i) => '<button type="button" class="opt" data-gsug="' + esc(s.t) + '">+ ' + esc(s.t) + '</button>').join('') + '<button type="button" class="opt" data-gnew>+ Otro</button></div></div>' +
      '<div class="sheet-actions"><button class="btn primary" type="button" data-close>Listo</button></div></div>';
  };

  $('#layer').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;

    else if (b.dataset.gper){ gg.per = b.dataset.gper; draw(); }
    else if (b.dataset.gsrc){ gg.src = b.dataset.gsrc; draw(); }

function openReview(){ review = {step:0, decide:{}, focus:''}; drawReview(); }
function drawReview(){
  const r = review, pending = tasks.filter(t => !t.done && t.plan && t.plan <= D(6));
  let body = '';
  if (r.step === 0) body = '<h2>Lo pendiente</h2><p class="lead">Decide qué pasa con cada tarea sin terminar.</p><div class="list">' + (pending.map(t => '<div class="card" style="padding:10px 12px;border-left:5px solid ' + colorOf(t) + '"><div class="tt">' + esc(t.t) + '</div><div class="choice">' + [['next','Semana que viene'],['inbox','A la bandeja'],['del','Borrar']].map(([k,l]) => '<button type="button" class="' + (r.decide[t.id] === k ? 'on' : '') + '" data-rdec="' + t.id + '" data-v="' + k + '">' + l + '</button>').join('') + '</div></div>').join('') || '<div class="empty">Nada pendiente. Bien hecho.</div>') + '</div>';
  else body = '<h2>Semana que viene</h2><p class="lead">Tiempo libre de cada día según tu horario fijo, y lo principal de la semana.</p><div class="list">' + [0,1,2,3,4,5,6].map(i => { const ds = fmt(add(W, 7+i)); return '<div class="ev" style="--dc:var(--accent)"><span class="h">' + WD[i] + '</span><span class="grow">' + (fixedOn(ds).map(f => f.t).join(', ') || 'Libre') + '</span><b>' + hm(freeMin(ds)) + '</b></div>'; }).join('') + '</div>' +
    '<div class="fld" style="margin-top:14px"><label for="rv-f">Lo principal de la semana</label><input class="inp title-inp" id="rv-f" placeholder="p. ej. Publicar la web" value="' + esc(r.focus) + '"></div>';
  $('#layer').innerHTML = '<div class="full rv" role="dialog" aria-label="Revisión del domingo"><div class="in"><div style="display:flex;justify-content:space-between;align-items:center"><span class="sect" style="margin:0">Revisión del domingo</span><button class="closex" type="button" data-close aria-label="Cerrar">×</button></div>' +
    '<div class="steps">' + [0,1].map(i => '<i class="' + (i <= r.step ? 'on' : '') + '"></i>').join('') + '</div>' + body +
    '<div class="sheet-actions" style="margin-top:auto;padding-top:20px">' + (r.step ? '<button class="btn ghost" type="button" data-rprev>Atrás</button>' : '') + '<button class="btn primary" type="button" data-rnext>' + (r.step === 1 ? 'Terminar' : 'Siguiente') + '</button></div></div></div>';

// ---------- eventos ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-task], [data-goto], [data-fixed], [data-editproj], [data-cday], .scrim');
  if (!b) return;
  const ds = b.dataset;
  if (ds.close !== undefined){ closeLayer(); return; }
  if (ds.toast){ toast(ds.toast); return; }
  if ($('#layer').onclick && b.closest('#layer')) return; // las hojas con su propio manejador
  if (ds.tab){ tab = ds.tab; editHome = false; render(); window.scrollTo(0,0); return; }
  if (ds.toggle){ e.stopPropagation(); const t = tasks.find(x => x.id == ds.toggle); t.done = !t.done; t.doneAt = t.done ? TS : undefined; t.st = t.done ? 'hecho' : (t.st === 'hecho' ? 'semana' : t.st); render(); return; }
  if (sheetTask){
    if (ds.sp){ readTaskForm(); sheetTask.p = ds.sp; drawTask(); }
    else if (ds.scat){ readTaskForm(); sheetTask.cat = ds.scat; drawTask(); }
    else if (ds.sdur){ readTaskForm(); sheetTask.dur = +ds.sdur; drawTask(); }
    else if (ds.splan !== undefined){ readTaskForm(); sheetTask.plan = ds.splan || null; drawTask(); }
    else if (ds.sst){ readTaskForm(); sheetTask.st = ds.sst; sheetTask.done = ds.sst === 'hecho'; drawTask(); }

      return '<div><i style="' + (st === 'done' ? 'background:' + (r ? r.c : 'var(--lo)') : st === 'miss' ? 'background:var(--hi)' : r ? 'box-shadow:inset 0 0 0 2px ' + r.c : 'background:var(--surface2)') + '"></i><span>' + WD[i][0] + '</span></div>'; }).join('') + '</div></div>';
  const rows = [];
  for (let k = 1; k <= 8; k++){ const ws = add(W, -7 * k), we = add(ws, 6); if (fmt(we) < startDate) break;
    const ds = [0,1,2,3,4,5,6].map(i => fmt(add(ws, i))), done = ds.filter(d => doneDays.has(d)).length, vol = sessions.filter(s => ds.includes(s.d)).reduce((a,s) => a + (s.vol || 0), 0);
    rows.push({w:isoW(ws), done, vol}); }
  h += '<div class="card" style="margin-top:12px"><div class="eyebrow"><span>Semanas anteriores</span><span>entrenos · kg movidos</span></div>' + (rows.length ? '<table class="wtable"><tbody>' + rows.map((r, i) => { const prev = rows[i+1], d = prev && prev.vol ? Math.round((r.vol - prev.vol) / prev.vol * 100) : null;
    return '<tr><td>Sem ' + r.w + '</td><td><b>' + r.done + '</b>/' + planned + '</td><td><div class="minibar"><i style="width:' + Math.min(100, r.done/planned*100) + '%;background:' + (r.done >= planned ? 'var(--lo)' : 'var(--mid)') + '"></i></div></td><td>' + nf(r.vol, 0) + ' kg</td><td style="color:' + (d === null ? 'var(--muted)' : d >= 0 ? 'var(--lo)' : 'var(--hi)') + '">' + (d === null ? '' : (d >= 0 ? '↑' : '↓') + Math.abs(d) + '%') + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">Aquí verás cada semana cuando lleves más de una.</div>') + '</div>';
  const withData = EX.filter(e => !e.lab && exHistory(e.id).length);
  h += '<div class="sect" style="margin-top:16px">Progreso por ejercicio</div>';
  if (!withData.length) return h + '<div class="card"><div class="empty">Cuando guardes tus primeros entrenos verás aquí la evolución de cada ejercicio y tus récords.</div></div>';
  if (!withData.some(e => e.id === progEx)) progEx = withData[0].id;
  const hist = exHistory(progEx), last = hist[hist.length-1], first = hist[0];
  h += '<div class="filters">' + withData.map(e => '<button type="button" class="fchip' + (progEx === e.id ? ' on' : '') + '" data-progex="' + e.id + '">' + esc(e.n) + '</button>').join('') + '</div>';
  h += '<div class="card"><div class="eyebrow"><span>' + esc(exOf(progEx).n) + ' · ' + hist.length + (hist.length === 1 ? ' sesión' : ' sesiones') + '</span><span style="color:' + (last.kg >= first.kg ? 'var(--lo)' : 'var(--hi)') + '">' + (last.kg >= first.kg ? '+' : '') + nf(last.kg - first.kg) + ' kg</span></div>' + (hist.length > 1 ? lineChart(hist) + '<div class="legend"><span><i style="--dc:var(--accent)"></i>Peso de trabajo</span><span><i style="--dc:var(--work)"></i>Fuerza estimada (1RM)</span></div>' : '<div class="empty">Con dos sesiones o más verás la gráfica.</div>') + '</div>';
  const best = hist.reduce((a,x) => x.kg > a.kg ? x : a, hist[0]), bestE = hist.reduce((a,x) => x.e > a.e ? x : a, hist[0]);
  h += '<div class="stats3" style="margin-top:12px"><div class="stat"><b>' + nf(best.kg) + '</b><small>kg · mejor peso (' + shortD(best.d) + ')</small></div><div class="stat"><b>' + nf(bestE.e, 0) + '</b><small>kg · 1RM estimado</small></div><div class="stat"><b>' + last.reps + '</b><small>reps con ' + nf(last.kg) + ' kg la última vez</small></div></div>';
  return h;
}
// ---- estadísticas con tus datos ----
function pStats(){
  const from = speriod === 'semana' ? D(0) : fmt(new Date(T.getFullYear(), T.getMonth(), 1)), days = datesBetween(from < startDate ? startDate : from, TS);
  const scores = days.map(dayScore).filter(x => x !== null), q = scores.length ? scores.reduce((a,b) => a + b, 0) / scores.length : null;
  const plannedDays = days.filter(d => PLAN[dow(parse(d))]).length, doneTr = days.filter(d => doneDays.has(d)).length;
  const doneT = tasks.filter(t => t.done && t.doneAt && inPeriod(t.doneAt, from, TS)).length, plannedT = tasks.filter(t => (t.plan && inPeriod(t.plan, from, TS)) || (t.doneAt && inPeriod(t.doneAt, from, TS))).length;
  const focus = days.reduce((a,d) => a + focusMin(d), 0);
  const sl = sleep.filter(s => inPeriod(s.d, from, TS)), avgSleep = sl.length ? sl.reduce((a,s) => a + sleepMin(s), 0) / sl.length : null, avgQ = sl.length ? sl.reduce((a,s) => a + s.q, 0) / sl.length : null;
  const p = me(), hp = p.hist.filter(x => inPeriod(x.d, from, TS)), wDiff = hp.length > 1 ? hp[hp.length-1].kg - hp[0].kg : null;
  const km = cardioLog.filter(c => inPeriod(c.d, from, TS)).reduce((a,c) => a + (Number(c.km) || 0), 0);
  const vol = weekVolume(), arr = Object.keys(MUS).map(m => ({m, v:vol[m]})).sort((a,b) => b.v - a.v);
  const stat = (v, l, c) => '<div class="stat"><b' + (c ? ' style="color:' + c + '"' : '') + '>' + v + '</b><small>' + l + '</small></div>';
  let h = '<div class="opts" style="margin-bottom:12px">' + [['semana','Esta semana'],['mes','Este mes']].map(([v,l]) => '<button type="button" class="opt' + (speriod === v ? ' on' : '') + '" data-speriod="' + v + '">' + l + '</button>').join('') + '</div>';
  h += '<div class="statgrid">' +
    stat(q === null ? '–' : nf(q) + '<small style="font-size:1rem;color:var(--muted)">/10</small>', 'calidad media de la comida', q === null ? '' : scoreC(q)) +
    stat(doneTr + '<small style="font-size:1rem;color:var(--muted)"> / ' + plannedDays + '</small>', 'entrenos hechos') +
    stat(doneT + (plannedT ? '<small style="font-size:1rem;color:var(--muted)"> / ' + plannedT + '</small>' : ''), 'tareas hechas') +
    stat(hm(focus), 'de enfoque (Pomodoro)') +
    stat(avgSleep === null ? '–' : hm(avgSleep), avgSleep === null ? 'sueño medio (sin datos)' : 'sueño medio · calidad ' + nf(avgQ) + '/5') +
    stat(wDiff === null ? '–' : (wDiff <= 0 ? '−' : '+') + nf(Math.abs(wDiff)) + ' kg', p.kg ? 'peso (' + nf(p.kg) + ' kg)' : 'peso (sin datos)', wDiff === null ? '' : wDiff <= 0 ? 'var(--lo)' : 'var(--mid)') +
    stat(MUS[arr[0].m], 'más series en tu plan · ' + arr[0].v + ' a la semana') +
    stat(MUS[arr[arr.length-1].m], 'menos series en tu plan · ' + arr[arr.length-1].v + ' a la semana', 'var(--mid)') +
    (km ? stat(nf(km) + ' km', 'de cardio') : '') + '</div>';
  const ws = weekScores();
  h += '<div class="card" style="margin-top:12px"><div class="eyebrow"><span>Calidad de la comida por día</span><span>/10</span></div><div class="wbars" style="grid-template-columns:repeat(7,1fr)">' +
    ws.map((v,i) => { const d = add(T, i - 6); return '<div><em class="bnum">' + (v === null ? '' : nf(v)) + '</em><b style="height:' + ((v || 0) * 10) + '%;background:' + scoreC(v) + '"></b><span>' + WD[dow(d)][0] + '</span></div>'; }).join('') + '</div></div>';
  if (projects.length){ const ph = projects.map(x => ({l:x.n, v:Math.round(days.reduce((a,d) => a + (Number((x.log || {})[d]) || 0), 0) / 6) / 10, c:x.c}));
    h += '<div class="card" style="margin-top:12px"><div class="eyebrow"><span>Horas por proyecto</span></div>' + hbars(ph, Math.max(1, ...ph.map(x => x.v)), ' h') + '</div>'; }
  const gd = days.filter(d => d >= startDate);
  if (goals.length && gd.length) h += '<div class="card" style="margin-top:12px"><div class="eyebrow"><span>Objetivos cumplidos</span><span>% de días</span></div>' + hbars(goals.filter(g => !(g.kind === 'auto' && g.src === 'entreno')).map(g => ({l:g.t, v:Math.round(gd.filter(d => goalMetOn(g, d)).length / gd.length * 100), c:g.c})), 100, '%') + '</div>';
  const good = [], bad = [];
  let streak = 0; for (let k = 1; k <= 52; k++){ const ws0 = add(W, -7 * k); if (fmt(add(ws0, 6)) < startDate) break; const n = [0,1,2,3,4,5,6].filter(i => doneDays.has(fmt(add(ws0, i)))).length; if (n >= Object.values(PLAN).filter(Boolean).length) streak++; else break; }
  if (streak >= 2) good.push('<b>Racha de ' + streak + ' semanas</b> cumpliendo todos los entrenos');
  const sd = ws.map((v,i) => [v, i]).filter(x => x[0] !== null);
  if (sd.length >= 3){ const b = sd.reduce((a,x) => x[0] > a[0] ? x : a), w = sd.reduce((a,x) => x[0] < a[0] ? x : a); good.push('<b>Mejor día comiendo:</b> ' + WDL[dow(add(T, b[1] - 6))] + ' (' + nf(b[0]) + '/10)'); if (w[0] < 6.5) bad.push('<b>Peor día comiendo:</b> ' + WDL[dow(add(T, w[1] - 6))] + ' (' + nf(w[0]) + '/10)'); }
  const low = arr.filter(x => x.v < 8); if (low.length) bad.push('<b>Poco trabajado:</b> ' + low.map(x => MUS[x.m].toLowerCase()).join(', '));
  const short = sleep.slice(-7).filter(s => sleepMin(s) < 420).length; if (short) bad.push('<b>Dormiste menos de 7 h</b> ' + short + (short === 1 ? ' noche' : ' noches'));
  if (good.length || bad.length) h += '<div class="card" style="margin-top:12px"><div class="eyebrow"><span>Lo mejor y lo mejorable</span></div><div class="list" style="margin-top:8px">' + good.map(x => '<div class="ev" style="--dc:var(--lo)"><span class="grow">' + x + '</span></div>').join('') + bad.map(x => '<div class="ev" style="--dc:var(--mid)"><span class="grow">' + x + '</span></div>').join('') + '</div></div>';
  return h;
}
function pCuerpo(){

  h += '<div class="card" style="margin-top:12px"><div class="eyebrow"><span>Medidas</span><button class="mini" type="button" data-measure>+ Apuntar</button></div><div class="list" style="margin-top:10px">' +
    measures.map(x => { const v = x.v || [], d = v.length > 1 ? v[v.length-1] - v[0] : null; return '<div class="ev" style="--dc:var(--accent)"><span class="grow"><b>' + x.n + '</b></span><span><b>' + (v.length ? nf(v[v.length-1]) + ' ' + x.u : '–') + '</b>' + (d !== null ? ' <span class="meta">' + (d > 0 ? '+' : '') + nf(d) + ' desde el primero</span>' : '') + '</span></div>'; }).join('') + '</div></div>';
  return h;
}
function pSueno(){
  if (!sleep.length) return '<div class="card"><div class="eyebrow"><span>Sueño</span></div><div class="empty">Aún no has apuntado ninguna noche.</div><button class="pill-btn" type="button" style="margin-top:8px" data-sleeplog>Apuntar anoche</button></div>';
  const srt = sleep.slice().sort((a,b) => a.d.localeCompare(b.d)), last = srt[srt.length - 1], wk7 = srt.slice(-7), avg = wk7.reduce((a,s) => a + sleepMin(s), 0) / wk7.length;
  let h = '<div class="card"><div class="eyebrow"><span>' + (last.d === TS ? 'Anoche' : 'Última noche apuntada · ' + shortD(last.d)) + '</span><button class="mini" type="button" data-sleeplog>Apuntar</button></div><div class="kpis"><div class="kpi"><b>' + hm(sleepMin(last)) + '</b><small>' + last.bed + ' → ' + last.wake + '</small></div><div class="kpi"><b style="font-size:1.4rem;letter-spacing:2px">' + qdots(last.q) + '</b><small>calidad</small></div></div></div>';
  h += '<div class="card" style="margin-top:12px"><div class="eyebrow"><span>Últimas ' + wk7.length + ' noches</span><span>media ' + hm(avg) + '</span></div><div class="wbars panbars" style="height:150px;grid-template-columns:repeat(7,1fr)">' +
    wk7.map(s => { const m = sleepMin(s); return '<div><em class="bnum">' + hm(m) + '</em><b style="height:' + Math.min(100, m / 600 * 100) + '%;background:' + (m >= 420 ? 'var(--lo)' : m >= 360 ? 'var(--mid)' : 'var(--hi)') + '"></b><span>' + WD[dow(parse(s.d))][0] + '</span></div>'; }).join('') +
    '</div><div class="meta" style="font-size:.76rem;margin-top:6px">Verde, 7 h o más · ámbar, 6–7 h · rojo, menos de 6 h</div></div>';

  return h;
